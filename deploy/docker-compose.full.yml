# Variante B: App + Datenbank + HTTPS (Caddy) komplett auf Hetzner.
# Start (aus dem Projektordner): docker compose -f deploy/docker-compose.full.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kiag
      POSTGRES_USER: kiag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kiag:${POSTGRES_PASSWORD}@db:5432/kiag
      DATABASE_SSL: disable
    depends_on: [db]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  pgdata:
  caddy_data:
